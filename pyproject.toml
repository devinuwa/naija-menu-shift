[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naija-menushift"
version = "0.1.0"
description = "Hack the Fork Nigeria 2026: evidence-aware plant-based menu adaptation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "scikit-learn>=1.4,<2", "pandas>=2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[project.scripts]
menushift = "menushift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
